<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Hritvik Gupta — software and AI-agent engineer. I build agents that do real work, not demos.">
  <title>Hritvik Gupta — software &amp; AI-agent engineer</title>
  <defs>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="1279" height="419" rx="16"/>
    </clipPath>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.5 L9 5 L0 9.5 Z" fill="#3A414D"/>
    </marker>
    <style>
      .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1280" height="420" fill="#0A0B0D"/>
    <rect width="1280" height="420" fill="url(#dots)"/>

    <!-- rails -->
    <line x1="0" y1="52.5" x2="1280" y2="52.5" stroke="#191C21"/>
    <line x1="0" y1="355.5" x2="1280" y2="355.5" stroke="#191C21"/>

    <!-- top rail -->
    <text class="mono" x="40" y="33" font-size="11.5" letter-spacing="2.6" fill="#F4F5F7">HRITVIK GUPTA</text>
    <text class="mono" x="1240" y="33" font-size="11.5" letter-spacing="1.4" fill="#5A616D" text-anchor="end">hritvikgupta.in</text>

    <!-- eyebrow -->
    <rect x="40" y="101" width="6" height="6" fill="#FF6B4A"/>
    <text class="mono" x="58" y="107" font-size="11" letter-spacing="2.4" fill="#FF6B4A">SOFTWARE &amp; AI-AGENT ENGINEER</text>

    <!-- headline -->
    <text class="sans" x="38" y="188" font-size="54" font-weight="600" letter-spacing="-1.4" fill="#F4F5F7">I build agents that do</text>
    <text class="sans" x="38" y="248" font-size="54" font-weight="600" letter-spacing="-1.4" fill="#FF6B4A">real work<tspan fill="#4C535E"> — not demos.</tspan></text>

    <!-- subline -->
    <text class="sans" x="40" y="300" font-size="16.5" fill="#8B929E">Multi-agent orchestration, longitudinal memory, and the</text>
    <text class="sans" x="40" y="324" font-size="16.5" fill="#8B929E">eval harnesses that keep them honest.</text>

    <!-- bottom rail -->
    <text class="mono" x="40"  y="391" font-size="10.5" letter-spacing="1.6" fill="#6B7280">PENN MEDICINE · VERMA LAB</text>
    <text class="mono" x="330" y="391" font-size="10.5" letter-spacing="1.6" fill="#454B55">MS COMPUTER ENGINEERING · UC RIVERSIDE</text>
    <text class="mono" x="1240" y="391" font-size="10.5" letter-spacing="1.6" fill="#454B55" text-anchor="end">PYTHON · TYPESCRIPT · SWIFT</text>

    <!-- agent loop diagram -->
    <g>
      <!-- arcs, clockwise: perception -> reasoning -> action -> verification -> back -->
      <g fill="none" stroke="#2C323B" stroke-width="1.25" marker-end="url(#arrow)">
        <path d="M1130.2 109.0 A105 105 0 0 1 1171.4 167.8"/>
        <path d="M1171.4 222.2 A105 105 0 0 1 1130.2 281.0"/>
        <path d="M1009.8 281.0 A105 105 0 0 1 968.6 222.2"/>
        <path d="M968.6 167.8 A105 105 0 0 1 1009.8 109.0"/>
      </g>

      <!-- memory core -->
      <circle cx="1070" cy="195" r="30" fill="none" stroke="#3A2A26" stroke-width="1" stroke-dasharray="2 4"/>
      <text class="mono" x="1070" y="198" font-size="8.5" letter-spacing="1.6" fill="#FF6B4A" text-anchor="middle">MEMORY</text>

      <!-- nodes -->
      <g>
        <rect x="1022" y="76"  width="96" height="28" rx="6" fill="#101317" stroke="#262B33"/>
        <text class="mono" x="1070" y="93.5" font-size="9" letter-spacing="1.2" fill="#A2A9B5" text-anchor="middle">PERCEPTION</text>

        <rect x="1127" y="181" width="96" height="28" rx="6" fill="#101317" stroke="#262B33"/>
        <text class="mono" x="1175" y="198.5" font-size="9" letter-spacing="1.2" fill="#A2A9B5" text-anchor="middle">REASONING</text>

        <rect x="1022" y="286" width="96" height="28" rx="6" fill="#101317" stroke="#262B33"/>
        <text class="mono" x="1070" y="303.5" font-size="9" letter-spacing="1.2" fill="#A2A9B5" text-anchor="middle">ACTION</text>

        <rect x="917"  y="181" width="96" height="28" rx="6" fill="#101317" stroke="#262B33"/>
        <text class="mono" x="965" y="198.5" font-size="9" letter-spacing="1.2" fill="#A2A9B5" text-anchor="middle">VERIFICATION</text>
      </g>

      <text class="mono" x="1070" y="337" font-size="9" letter-spacing="2.2" fill="#3F454F" text-anchor="middle">THE LOOP I OPTIMIZE</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#1E222A"/>
</svg>
