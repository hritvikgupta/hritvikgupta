<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Hritvik Gupta — AI Agent Engineer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff4dd2"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#fade)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.5"/>

  <!-- orbiting node accents -->
  <g stroke="#2dd4bf" stroke-width="1" opacity="0.35" fill="none">
    <circle cx="1040" cy="140" r="86"/>
    <circle cx="1040" cy="140" r="54"/>
    <circle cx="1040" cy="140" r="24"/>
  </g>
  <circle cx="1040" cy="140" r="5" fill="#00e5ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1126" cy="140" r="4" fill="#7c4dff">
    <animateTransform attributeName="transform" type="rotate" from="0 1040 140" to="360 1040 140" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1094" cy="140" r="3" fill="#ff4dd2">
    <animateTransform attributeName="transform" type="rotate" from="120 1040 140" to="480 1040 140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1064" cy="140" r="2.5" fill="#00e5ff">
    <animateTransform attributeName="transform" type="rotate" from="240 1040 140" to="600 1040 140" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal prompt -->
  <text x="72" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#2dd4bf">~/hritvik $ <tspan fill="#8b949e">whoami</tspan></text>

  <text x="70" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="url(#neon)" filter="url(#glow)">HRITVIK GUPTA</text>

  <text x="72" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#c9d1d9">software &amp; AI-agent engineer — building autonomous systems that ship real work<tspan fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▊</tspan></text>

  <text x="72" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">[ agents · llm-infra · evals · cloud-ops · terminal-tools ]</text>
</svg>
