name: Refresh profile statistics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The `secrets` context can't be used in a step-level `if`, so surface it
    # as an env var and gate on that instead.
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only refresh when a personal token is configured. The built-in
      # GITHUB_TOKEN can't see private repos or private contributions, so
      # letting it run would overwrite the committed cards with worse numbers.
      - name: Regenerate the statistics section
        if: env.STATS_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit if anything changed
        if: env.STATS_TOKEN != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh profile statistics"
          git push

      - name: Explain the no-op
        if: env.STATS_TOKEN == ''
        run: |
          echo "::notice::No STATS_TOKEN secret configured — keeping the committed numbers."
          echo "Add a classic PAT with 'repo' + 'read:user' scope as the STATS_TOKEN"
          echo "repository secret to have these numbers refresh automatically."
