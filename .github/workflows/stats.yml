name: Refresh profile stat cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only refresh when a personal token is configured. The built-in
      # GITHUB_TOKEN can't see private repos or private contributions, so
      # letting it run would overwrite the committed cards with worse numbers.
      - name: Regenerate stat cards
        if: ${{ secrets.STATS_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit if anything changed
        if: ${{ secrets.STATS_TOKEN != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stat cards"
          git push
